# Rate limiting: 20 requests per second per IP, no burst
# Connection limiting: max 10 concurrent connections per IP
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=connlimit:10m;

server {
    listen 80;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Keep connection limit global, but apply request-rate limit only to dynamic routes
    limit_conn connlimit 10;

    # Access and error logging to stdout/stderr for Docker
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    # Include MIME types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Root directory for static files
    root   /usr/share/nginx/html;
    index  index.html;

    # Hide nginx version for security
    server_tokens off;

    # Increase body size for file uploads
    client_max_body_size 100M;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/css
        text/xml
        text/plain
        image/svg+xml
        application/xml
        text/javascript
        application/json
        application/xml+rss
        application/javascript;

    # Custom error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # Handle static assets first with caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # Frontend static files — served directly from the shared volume
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        limit_req zone=mylimit burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files for Django admin and API
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media files - serve directly instead of proxying
    location /media/ {
        alias /app/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket support
    location /ws/ {
        limit_req zone=mylimit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint (no redirect)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Admin panel
    location /admin/ {
        limit_req zone=mylimit burst=20 nodelay;
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google OAuth callback
    location /accounts/ {
        limit_req zone=mylimit burst=20 nodelay;
        proxy_pass http://backend:8000/accounts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana UI
    location /grafana/ {
        limit_req zone=mylimit burst=20 nodelay;
        set $grafana_upstream http://fms-prod-grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_intercept_errors on;
        error_page 502 503 504 = @grafana_unavailable;
    }

    location @grafana_unavailable {
        default_type text/plain;
        return 503 "Grafana is unavailable\n";
    }

    # Deny access to sensitive files
    location ~* \.(htaccess|htpasswd|ini|log|conf)$ {
        deny all;
    }
}

# Internal server block for Nginx metrics/status (not exposed to the public)
server {
    listen 8080;
    server_name localhost;

    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }
}
